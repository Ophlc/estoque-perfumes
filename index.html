<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estoque - Perfumes Fator 5</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 30px;
    font-size: 2.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

.total {
    background: linear-gradient(45deg, #ff6b6b, #feca57);
    color: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 30px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.form-group {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 30px;
}

input {
    padding: 15px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 16px;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.9);
}

input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
}

.add {
    grid-column: 1 / -1;
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 18px 30px;
    border-radius: 12px;
    font-size: 1.2em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.add:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
}

.pesquisa {
    grid-column: 1 / -1;
    margin-bottom: 30px;
}

.pesquisa input {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    display: block;
    font-size: 1.1em;
}

.pesquisa::after {
    content: "🔍";
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
}

.lista-produtos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
}

.produto {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    border: 1px solid #f0f0f0;
    position: relative;
    overflow: hidden;
}

.produto::before {
    content: "🌸";
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 2em;
    opacity: 0.1;
}

.produto:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.produto strong {
    color: #2c3e50;
    font-size: 1.3em;
    display: block;
    margin-bottom: 10px;
}

.produto div {
    color: #7f8c8d;
    margin-bottom: 8px;
    font-size: 1.1em;
}

.botoes {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.vender, .repor, .excluir {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9em;
}

.vender {
    background: #e74c3c;
    color: white;
}

.vender:hover {
    background: #c0392b;
    transform: scale(1.05);
}

.repor {
    background: #27ae60;
    color: white;
}

.repor:hover {
    background: #229954;
    transform: scale(1.05);
}

.excluir {
    background: #95a5a6;
    color: white;
}

.excluir:hover {
    background: #7f8c8d;
    transform: scale(1.05);
}

.vazio {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: #7f8c8d;
    font-size: 1.2em;
}

@media (max-width: 768px) {
    .form-group {
        grid-template-columns: 1fr;
    }
    
    .lista-produtos {
        grid-template-columns: 1fr;
    }
    
    h1 {
        font-size: 2em;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>📦 Estoque - Fator 5</h1>

<div class="total" id="total"></div>

<div class="pesquisa">
    <input type="text" id="pesquisa" placeholder="🔍 Pesquisar perfume pelo nome ou número...">
</div>

<div class="form-group">
    <input type="text" id="identificacao" placeholder="Nome / Número do perfume">
    <input type="number" id="quantidade" placeholder="Quantidade inicial">
    <input type="number" id="preco" placeholder="Preço (opcional)">
    <button class="add" onclick="adicionarProduto()">Adicionar perfume</button>
</div>

<div id="lista" class="lista-produtos"></div>

</div>

<script>

let produtos = JSON.parse(localStorage.getItem("estoque")) || [];
let produtosFiltrados = [...produtos];

function salvar() {
localStorage.setItem("estoque", JSON.stringify(produtos));
mostrarProdutos();
atualizarTotal();
}

function atualizarTotal() {
let total = produtos.reduce((soma, p) => soma + p.quantidade, 0);
document.getElementById("total").innerText =
"Total de perfumes em estoque: " + total;
}

function adicionarProduto() {
const identificacao = document.getElementById("identificacao").value.trim();
const quantidade = parseInt(document.getElementById("quantidade").value);
const preco = document.getElementById("preco").value;

if (identificacao === "" || isNaN(quantidade)) {
alert("Preencha o nome ou número do perfume e a quantidade");
return;
}

const existe = produtos.some(
p => p.identificacao.toLowerCase() === identificacao.toLowerCase()
);

if (existe) {
alert("Esse perfume já está cadastrado");
return;
}

produtos.push({ identificacao, quantidade, preco });
produtosFiltrados = [...produtos];

salvar();

document.getElementById("identificacao").value = "";
document.getElementById("quantidade").value = "";
document.getElementById("preco").value = "";
}

function venderProduto(index) {
produtos[index].quantidade--;
if (produtos[index].quantidade <= 0) {
produtos.splice(index, 1);
}
produtosFiltrados = produtos.filter(p => 
    produtos.findIndex(prod => prod.identificacao === p.identificacao) !== -1
);
salvar();
}

function reporProduto(index) {
produtos[index].quantidade++;
produtosFiltrados = [...produtos];
salvar();
}

function removerProduto(index) {
produtos.splice(index, 1);
produtosFiltrados = produtos.filter(p => 
    produtos.findIndex(prod => prod.identificacao === p.identificacao) !== -1
);
salvar();
}

function mostrarProdutos() {
const lista = document.getElementById("lista");
lista.innerHTML = "";

if (produtosFiltrados.length === 0) {
    lista.innerHTML = '<div class="vazio">Nenhum perfume encontrado</div>';
    return;
}

produtosFiltrados.forEach((p, i) => {
    // Encontrar o índice original no array produtos
    const indexOriginal = produtos.findIndex(prod => 
        prod.identificacao.toLowerCase() === p.identificacao.toLowerCase()
    );
    
    lista.innerHTML += `
    <div class="produto">
        <strong>${p.identificacao}</strong>
        <div>Quantidade: ${p.quantidade}</div>
        <div>Preço: ${p.preco ? "R$ " + p.preco : "—"}</div>
        <div class="botoes">
            <button class="vender" onclick="venderProduto(${indexOriginal})">Vender</button>
            <button class="repor" onclick="reporProduto(${indexOriginal})">Repor</button>
            <button class="excluir" onclick="removerProduto(${indexOriginal})">Excluir</button>
        </div>
    </div>
    `;
});
}

// Pesquisa em tempo real
document.getElementById("pesquisa").addEventListener("input", function() {
    const termo = this.value.toLowerCase().trim();
    
    if (termo === "") {
        produtosFiltrados = [...produtos];
    } else {
        produtosFiltrados = produtos.filter(p => 
            p.identificacao.toLowerCase().includes(termo)
        );
    }
    
    mostrarProdutos();
});

mostrarProdutos();
atualizarTotal();

</script>

</body>
</html>
