<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estoque - Perfumes Fator 5</title>

<link rel="stylesheet" href="estilo-pagina.css">

</head>

<body>

<div class="container">

<h1>📦 Estoque - Fator 5</h1>

<div class="total" id="total"></div>

<div class="pesquisa">
    <input type="text" id="pesquisa" placeholder="🔍 Pesquisar perfume pelo nome ou número...">
</div>

<div class="form-group">
    <input type="text" id="identificacao" placeholder="Nome / Número do perfume">
    <input type="number" id="quantidade" placeholder="Quantidade inicial">
    <input type="number" id="preco" placeholder="Preço (opcional)">
    <button class="add" onclick="adicionarProduto()">Adicionar perfume</button>
</div>

<div id="lista" class="lista-produtos"></div>

</div>

<script src="script.js"></script>

</body>
</html>
